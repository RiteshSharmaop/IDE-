version: "3.9"

networks:
  ide-network:
    driver: bridge

services:
  mongodb:
    image: mongo:latest
    container_name: code-ide-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: code-ide
    restart: unless-stopped
    networks:
      - ide-network

  redis:
    image: redis/redis-stack
    container_name: code-ide-redis
    # Port not exposed to host - accessed internally via docker network
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - ide-network

  backend:
    build: .
    container_name: code-ide-backend
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
      - redis
      - code-executor
    environment:
      - PORT=8080
      - MONGODB_URI=mongodb://mongodb:27017/code-ide
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    networks:
      - ide-network


  code-executor:
    build:
      context: .
      dockerfile: src/services/codeExecutor/Dockerfile
    container_name: code-executor
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # read_only: true
    volumes:
      - ./execution:/execution
    tmpfs:
      - /tmp
      # - /execution
    network_mode: none
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
